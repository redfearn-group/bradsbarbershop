  <!-- handle scales -->
  <rect x="228" y="49" width="90" height="20" rx="10" transform="rotate(13 228 59)"
        fill="var(--ill-accent, #BF1E2E)" stroke="var(--ill-ink, #0A1128)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="248" y1="55" x2="300" y2="72" stroke="var(--ill-ink, #0A1128)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <!-- pivot pin -->
  <circle cx="232" cy="59" r="6" fill="var(--ill-ink, #0A1128)" stroke="var(--ill-ink, #0A1128)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
